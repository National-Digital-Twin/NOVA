apiVersion: networking.istio.io/v1beta1
kind: VirtualService

metadata:
  name: nova-virtual-service
spec:
  hosts:
    - placeholder
  gateways:
    - placeholder
  http:
    # Rule for root ("/") to prevent caching and add CSP header
    - match:
        - uri:
            exact: /
      headers:
        response:
          add:
            Cache-Control: "no-cache, no-store, must-revalidate"
            Pragma: "no-cache"
            Expires: "0"
            Content-Security-Policy: "placeholder"
            Access-Control-Allow-Origin: "placeholder"
      route:
        - destination:
            host: nova
            port:
              number: 80

    # Rule for all other paths with the CSP header
    - match:
        - uri:
            prefix: /
      rewrite:
        uriRegexRewrite:
          match: ^/(/|$)(.*)
          rewrite: /\2
      headers:
        response:
          add:
            Content-Security-Policy: "placeholder"
            Access-Control-Allow-Origin: "placeholder"
      route:
        - destination:
            host: nova
            port:
              number: 80