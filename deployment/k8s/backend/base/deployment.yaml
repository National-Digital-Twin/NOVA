apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-backend
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: nova-backend
  template:
    metadata:
      annotations: {}
      labels:
        io.kompose.service: nova-backend
    spec:
      serviceAccountName: nova-backend-sa
      containers:
        - image: nova-backend-image:template
          env:
            - name: IMAGE_DIGEST
              value: "none"
          name: backend
          resources:
            limits:
              memory: "1Gi"
            requests:
              cpu: "0.25"
              memory: "256Mi"
              ephemeral-storage: "2Gi"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
      restartPolicy: Always
